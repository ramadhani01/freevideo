<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bagikan ke Teman</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--text:#1a2421;--muted:#6b7a75;--line:#dde4e1;--green:#1fa855;--green-d:#168a44;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101513;--card:#1a211e;--text:#eef3f1;--muted:#93a39d;--line:#2c3733}}
:root[data-theme="dark"]{--bg:#101513;--card:#1a211e;--text:#eef3f1;--muted:#93a39d;--line:#2c3733}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center}
.emoji{font-size:3rem;line-height:1}
h1{font-size:1.4rem;margin:12px 0 6px}
p{color:var(--muted);margin:0 0 22px}
button{width:100%;border:0;border-radius:12px;background:var(--green);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;padding:14px;cursor:pointer}
button:active{background:var(--green-d)}
</style>
</head>
<body>
<div class="card">
  <div class="emoji">🎉</div>
  <h1>Ajak Teman-temanmu!</h1>
  <p>Tekan tombol di bawah untuk membagikan link saluran WhatsApp saya.</p>
  <button type="button" id="share">Bagikan</button>
</div>
<script>
document.getElementById("share").onclick=function(){
  var pesan="Halo! Gabung ke saluran WhatsApp saya ya: https://whatsapp.com/channel/0029VbESt7p2UPBAqtbNEi0I";
  window.open("https://wa.me/?text="+encodeURIComponent(pesan),"_blank");
};
</script>
</body>
</html>
